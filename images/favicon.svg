<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Logo Group with Glow -->
  <g filter="url(#glow)">
    <!-- Bag Handle -->
    <path d="M 206 180 C 206 130, 306 130, 306 180" 
          fill="none" 
          stroke="url(#strokeGrad)" 
          stroke-width="26" 
          stroke-linecap="round"/>

    <!-- Bag Outline with Monogram M -->
    <path d="M 130 380 L 170 190 L 342 190 L 382 380 Z" 
          fill="none" 
          stroke="url(#strokeGrad)" 
          stroke-width="24" 
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- Stylized Geometric M inside -->
    <path d="M 170 190 L 256 310 L 342 190" 
          fill="none" 
          stroke="url(#strokeGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Dynamic Speed Wing / Geometric Accent -->
    <path d="M 210 380 L 256 320 L 302 380" 
          fill="none" 
          stroke="url(#strokeGrad)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Sparkle / Star of Excellence -->
    <path d="M 370 145 Q 370 165 390 165 Q 370 165 370 185 Q 370 165 350 165 Q 370 165 370 145 Z" 
          fill="#ffffff"/>
  </g>
</svg>
